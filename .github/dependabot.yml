# Dependabot opens pull requests for outdated or vulnerable packages. Each one goes through CI and
# review like any other change. Updates are grouped so there's one pull request per ecosystem a week.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /services/inference
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
