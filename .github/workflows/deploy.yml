name: Deploy

# Ships main to the servers after CI passes. No AWS keys are stored: GitHub signs in to the
# bantaybuhay-github-deploy role, which can only upload releases and run deploy commands on
# servers tagged Project=bantaybuhay.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  BUCKET: bantaybuhay-deploy-195170887047
  ROLE_ARN: arn:aws:iam::195170887047:role/bantaybuhay-github-deploy

jobs:
  deploy:
    # Only a push to main in this repository that passed CI. The repository is public, so a pull
    # request from a fork whose branch is also called "main" would otherwise match the filter
    # above and deploy the fork's code. A manual run must be started on main too; the production
    # environment refuses any other branch as well.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build

      - name: Package the release
        id: package
        run: |
          id="$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
          tar -czf release.tgz \
            package.json package-lock.json \
            packages/shared/package.json packages/shared/dist \
            apps/api/package.json apps/api/dist apps/api/certs \
            apps/web/package.json apps/web/dist \
            services/inference/app services/inference/requirements.txt \
            infra/server infra/nginx
          echo "id=$id" >> "$GITHUB_OUTPUT"
          ls -lh release.tgz

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload the release
        run: aws s3 cp release.tgz "s3://$BUCKET/releases/${{ steps.package.outputs.id }}.tgz" --only-show-errors

      - name: Deploy to the web server
        run: bash infra/server/remote-deploy.sh web "${{ steps.package.outputs.id }}"

      # The detector server is usually stopped to save credit; it's updated only when running.
      - name: Deploy to the detector server
        run: bash infra/server/remote-deploy.sh detector "${{ steps.package.outputs.id }}"

      - name: Check the public site
        run: |
          host="$(aws ssm get-parameter --name /bantaybuhay/site/SERVER_NAME --query Parameter.Value --output text 2>/dev/null || true)"
          if [ -z "$host" ]; then echo "No public name recorded yet."; exit 0; fi
          scheme=https
          curl -sf -o /dev/null --max-time 10 "https://$host/" || scheme=http
          curl -sf --max-time 10 "$scheme://$host/api/readyz" | grep '"status":"ready"'
          echo "Live at $scheme://$host"

  # A failed deploy opens (or adds to) an issue assigned to the team, so GitHub emails everyone,
  # not only the person whose merge triggered it. The next successful deploy closes it.
  report:
    needs: deploy
    if: always() && needs.deploy.result != 'skipped' && needs.deploy.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v8
        env:
          RESULT: ${{ needs.deploy.result }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = "Production deploy failed";
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const commit = process.env.SHA.slice(0, 7);
            const open = (await github.rest.issues.listForRepo({ owner, repo, state: "open", labels: "deploy-failure" })).data;
            if (process.env.RESULT === "success") {
              for (const issue of open) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `Fixed: commit ${commit} deployed. ${run}` });
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: "closed", state_reason: "completed" });
              }
              return;
            }
            const body = [
              `The deploy of commit ${commit} failed: ${run}`,
              "",
              "Each server that failed its health check went back to its previous release, so the live site should still be up. Open the run, find the failed step, and read the server output printed there.",
              "",
              "To return the web server to the release before this one: Actions > Server operations > rollback-web.",
            ].join("\n");
            if (open.length) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open[0].number, body });
            } else {
              // Everyone who can push; the owner alone if the token may not list collaborators.
              let assignees = [owner];
              try {
                const collaborators = await github.rest.repos.listCollaborators({ owner, repo, permission: "push" });
                assignees = collaborators.data.map((user) => user.login).slice(0, 10);
              } catch (error) {
                core.warning(`Couldn't list collaborators, assigning ${owner}: ${error.message}`);
              }
              await github.rest.issues.create({ owner, repo, title, body, labels: ["deploy-failure"], assignees });
            }
