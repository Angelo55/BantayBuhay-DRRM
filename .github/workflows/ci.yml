name: CI

on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    # The API tests' throwaway database. On Windows laptops, npm run test:db provides the same.
    services:
      postgres:
        image: postgis/postgis:17-3.7-alpine
        env:
          POSTGRES_USER: bantaybuhay
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: bantaybuhay_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U bantaybuhay -d bantaybuhay_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/inference
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  stack:
    needs: [node, python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash infra/smoke.sh
