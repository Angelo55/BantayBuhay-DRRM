name: CI

on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    # The API tests' throwaway database. On Windows laptops, npm run test:db provides the same.
    services:
      postgres:
        image: postgis/postgis:17-3.7-alpine
        env:
          POSTGRES_USER: bantaybuhay
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: bantaybuhay_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U bantaybuhay -d bantaybuhay_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The built API, started as on a server, must connect to its database and report ready.
      - name: Smoke-test the built API
        env:
          DATABASE_URL: postgres://bantaybuhay:test-only@127.0.0.1:55432/bantaybuhay_test
          HOST: 127.0.0.1
        run: |
          node apps/api/dist/server.js > api.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/api/readyz > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/api/readyz | grep '"status":"ready"' || { cat api.log; exit 1; }
          curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/incidents | grep 401

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/inference
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

