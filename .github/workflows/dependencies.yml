name: Dependency audit

# Checks the packages the app ships with against published security advisories. It's separate
# from CI on purpose: an advisory published today shows as a failed check and should be fixed
# soon, but it never blocks a deploy of main, so an urgent fix can still go out.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 1 * * 1" # Mondays, 9:17 AM Philippine time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      # Packages that run in production; development tools are left to Dependabot.
      - name: Node packages (high and critical)
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Detector packages
        working-directory: services/inference
        run: |
          python -m pip install --quiet pip-audit
          pip-audit --requirement requirements.txt --progress-spinner off
