name: bantaybuhay

# Only nginx publishes a port. Everything else stays on private networks.
services:
  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-127.0.0.1:8080}:80"
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "apps/api/dist/migrate.js"]
    environment:
      DATABASE_URL: postgres://bantaybuhay:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/bantaybuhay
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy

  # Test accounts only. Run with infra/seed.sh, never automatically.
  seed:
    profiles: [tools]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "apps/api/dist/seed.js"]
    environment:
      DATABASE_URL: postgres://bantaybuhay:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/bantaybuhay
      ALLOW_SEED: "true"
    networks: [backend]
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://bantaybuhay:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/bantaybuhay
      REDIS_URL: redis://:${REDIS_PASSWORD:?set in .env}@redis:6379
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DETECTOR_TOKEN: ${DETECTOR_TOKEN:?set in .env}
      SNAPSHOT_DIR: /data/snapshots
    volumes:
      - snapshots:/data/snapshots
    networks: [edge, backend]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  inference:
    build: services/inference
    restart: unless-stopped
    environment:
      API_URL: http://api:3000
      DETECTOR_TOKEN: ${DETECTOR_TOKEN:?set in .env}
      RTSP_BASE: rtsp://mediamtx:8554
      FRAMES_PER_SECOND: "2"
    networks: [backend]
    depends_on:
      mediamtx:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Simulated camera streams. Drop clips into media/sim/ to replace the test patterns.
  mediamtx:
    image: bluenviron/mediamtx:1.21.3-ffmpeg
    restart: unless-stopped
    volumes:
      - ./infra/mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ./infra/mediamtx/feed.sh:/scripts/feed.sh:ro
      - ./media/sim:/media:ro
    networks: [backend]

  postgres:
    image: postgis/postgis:17-3.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bantaybuhay
      POSTGRES_DB: bantaybuhay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bantaybuhay -d bantaybuhay"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.8-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set in .env}
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  edge:
  backend:
    internal: true

volumes:
  postgres_data:
  redis_data:
  snapshots:
