# Simulated cameras for development and the demo. Each path plays media/sim/<name>.mp4 on
# a loop if that file exists, and a moving test pattern otherwise. Real cameras would
# replace these paths with their own RTSP sources. Only the private Docker network can reach it.
logLevel: info
rtsp: yes
rtspAddress: :8554
rtmp: no
hls: no
webrtc: no
srt: no
api: no

pathDefaults:
  runOnInit: sh /scripts/feed.sh $MTX_PATH
  runOnInitRestart: yes

paths:
  sim/barangay-1:
  sim/binicuil:
  sim/tagukon:
  sim/hilamonan:
  sim/tampalon:
  sim/camansi:
